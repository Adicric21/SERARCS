services:
  postgres:
    image: postgres:16-alpine
    container_name: den-den-sos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: den_den_sos
    ports:
      - "5432:5432"
    volumes:
      - den_den_sos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d den_den_sos"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  den_den_sos_pgdata:
